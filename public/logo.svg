<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 68 68">
  <defs>
    <clipPath id="left"><rect x="0" y="0" width="32" height="64"/></clipPath>
    <clipPath id="right"><rect x="32" y="0" width="32" height="64"/></clipPath>
    <mask id="jaws">
      <rect x="-10" y="-10" width="84" height="84" fill="#fff"/>
      <rect x="61" y="29.4" width="12" height="5.2" fill="#000"/>
      <rect x="-9" y="29.4" width="12" height="5.2" fill="#000"/>
    </mask>
    <g id="gear">
      <circle cx="32" cy="32" r="20" fill="none" stroke-width="6.5"/>
      <g>
        <rect x="28.5" y="5" width="7" height="8" rx="1"/>
        <rect x="28.5" y="5" width="7" height="8" rx="1" transform="rotate(45 32 32)"/>
        <rect x="28.5" y="5" width="7" height="8" rx="1" transform="rotate(90 32 32)"/>
        <rect x="28.5" y="5" width="7" height="8" rx="1" transform="rotate(135 32 32)"/>
        <rect x="28.5" y="5" width="7" height="8" rx="1" transform="rotate(180 32 32)"/>
        <rect x="28.5" y="5" width="7" height="8" rx="1" transform="rotate(225 32 32)"/>
        <rect x="28.5" y="5" width="7" height="8" rx="1" transform="rotate(270 32 32)"/>
        <rect x="28.5" y="5" width="7" height="8" rx="1" transform="rotate(315 32 32)"/>
      </g>
    </g>
  </defs>

  <!-- wrench, running behind the gear -->
  <g transform="rotate(-45 32 32)" fill="#2F6DB5" mask="url(#jaws)">
    <rect x="2" y="29" width="60" height="6" rx="1.5"/>
    <circle cx="63" cy="32" r="7.2"/>
    <circle cx="1" cy="32" r="7.2"/>
  </g>

  <!-- clear the centre so the bar doesn't show through -->
  <circle cx="32" cy="32" r="17" fill="var(--logo-bg, #ffffff)"/>

  <!-- gear: navy on the left, gold on the right -->
  <use href="#gear" clip-path="url(#left)" fill="#173F78" stroke="#173F78"/>
  <use href="#gear" clip-path="url(#right)" fill="#C9A24A" stroke="#C9A24A"/>

  <!-- tf monogram -->
  <g fill="none" stroke-width="4.4" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M27 21.5v15.2c0 2.6 1.3 3.8 3.8 3.8" stroke="#C9A24A"/>
    <path d="M36.5 42.5V28c0-3.4 1.8-5.2 5.2-5.2" stroke="#173F78"/>
    <path d="M22.5 27.5h19" stroke="#173F78"/>
  </g>
</svg>
